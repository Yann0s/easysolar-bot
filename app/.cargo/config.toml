# Windows : CRT liée en statique (Rust et llama.cpp), l'exe ne demande pas le redistribuable Visual C++.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
LLAMA_STATIC_CRT = "1"
# lu par le crate cmake pour la seule cible Windows : force /MT dans llama.cpp
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = "cmake/msvc-static-crt.cmake", relative = true }
